<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC Agent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/lucide@latest">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-box glass">
            <div class="logo-area">
                <i data-lucide="terminal" class="logo-icon"></i>
                <h1>HC Agent</h1>
            </div>
            <p class="subtitle">Sign in to manage your world</p>
            <input type="email" id="auth-email" class="input-field" placeholder="Email">
            <input type="password" id="auth-pass" class="input-field" placeholder="Password">
            <div id="auth-error" class="error-msg"></div>
            <button id="btn-login" class="btn-primary">Sign In / Register</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="screen">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar">
            <div class="brand">
                <i data-lucide="terminal"></i>
                <span>HC Agent</span>
            </div>
            <nav>
                <button class="nav-item active" onclick="switchTab('dashboard')">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </button>
                <button class="nav-item" onclick="switchTab('notes')">
                    <i data-lucide="file-text"></i> Notes
                </button>
                <button class="nav-item" onclick="switchTab('tasks')">
                    <i data-lucide="check-square"></i> Tasks
                </button>
                <button class="nav-item" onclick="switchTab('expenses')">
                    <i data-lucide="wallet"></i> Expenses
                </button>
                <button class="nav-item" onclick="switchTab('ai')">
                    <i data-lucide="bot"></i> AI Agent                </button>
                <button class="nav-item" onclick="switchTab('settings')">
                    <i data-lucide="settings"></i> Settings
                </button>
            </nav>
            <div class="user-info">
                <span id="user-email-display">user@email.com</span>
                <button id="btn-logout" class="btn-small">Logout</button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-bar">
                <h2 id="page-title">Dashboard</h2>
                <div class="status-badge">All OK</div>
            </header>

            <!-- Pages -->
            <div id="page-dashboard" class="page active fade-in">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="icon-box blue"><i data-lucide="wallet"></i></div>
                        <div class="stat-text">
                            <h3>Total Expenses</h3>
                            <p id="dash-expenses">৳0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="icon-box purple"><i data-lucide="check-circle"></i></div>
                        <div class="stat-text">
                            <h3>Pending Tasks</h3>
                            <p id="dash-tasks">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="icon-box cyan"><i data-lucide="file-text"></i></div>
                        <div class="stat-text">
                            <h3>Total Notes</h3>
                            <p id="dash-notes">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-notes" class="page">
                <div class="action-bar">
                    <button class="btn-primary" onclick="openModal('modal-note')">+ New Note</button>
                </div>                <div id="notes-list" class="grid-list"></div>
            </div>

            <div id="page-tasks" class="page">
                <div class="action-bar">
                    <button class="btn-primary" onclick="openModal('modal-task')">+ New Task</button>
                </div>
                <div id="tasks-list" class="list-stack"></div>
            </div>

            <div id="page-expenses" class="page">
                <div class="action-bar">
                    <button class="btn-primary" onclick="openModal('modal-expense')">+ Add Expense</button>
                </div>
                <div id="expenses-list" class="list-stack"></div>
            </div>

            <div id="page-ai" class="page">
                <div class="chat-container glass">
                    <div id="chat-history" class="chat-history">
                        <div class="msg bot">Hello Juel! How can I help with HavenCraft?</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="ai-input" placeholder="Ask something..." class="input-field">
                        <button id="btn-send-ai" class="btn-icon"><i data-lucide="send"></i></button>
                    </div>
                </div>
            </div>

            <div id="page-settings" class="page">
                <div class="glass-card settings-box">
                    <h3>Configuration</h3>
                    <label>NVIDIA API Key</label>
                    <input type="password" id="setting-apikey" class="input-field" placeholder="nvapi-...">
                    <button id="btn-save-settings" class="btn-primary mt-2">Save Settings</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav">
        <button onclick="switchTab('dashboard')" class="m-nav active"><i data-lucide="layout-dashboard"></i></button>
        <button onclick="switchTab('notes')" class="m-nav"><i data-lucide="file-text"></i></button>
        <button onclick="switchTab('tasks')" class="m-nav"><i data-lucide="check-square"></i></button>
        <button onclick="switchTab('expenses')" class="m-nav"><i data-lucide="wallet"></i></button>
        <button onclick="switchTab('ai')" class="m-nav"><i data-lucide="bot"></i></button>
    </nav>

    <!-- Modals -->    <div id="modal-note" class="modal-overlay hidden">
        <div class="modal-box glass">
            <h3>Add Note</h3>
            <input type="text" id="note-title" class="input-field" placeholder="Title">
            <textarea id="note-content" class="input-field" placeholder="Content..."></textarea>
            <div class="modal-btns">
                <button onclick="closeModal('modal-note')" class="btn-secondary">Cancel</button>
                <button id="btn-save-note" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <div id="modal-task" class="modal-overlay hidden">
        <div class="modal-box glass">
            <h3>Add Task</h3>
            <input type="text" id="task-title" class="input-field" placeholder="Task Name">
            <input type="date" id="task-date" class="input-field">
            <div class="modal-btns">
                <button onclick="closeModal('modal-task')" class="btn-secondary">Cancel</button>
                <button id="btn-save-task" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <div id="modal-expense" class="modal-overlay hidden">
        <div class="modal-box glass">
            <h3>Add Expense</h3>
            <input type="text" id="exp-title" class="input-field" placeholder="Title">
            <input type="number" id="exp-amount" class="input-field" placeholder="Amount (৳)">
            <div class="modal-btns">
                <button onclick="closeModal('modal-expense')" class="btn-secondary">Cancel</button>
                <button id="btn-save-expense" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
</body>
</html>
